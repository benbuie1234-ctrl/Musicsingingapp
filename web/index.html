<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sing</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<main id="dashboard">
  <header class="top">
    <h1>Sing</h1>
    <p class="sub">Pick a song and sing it. Headphones required.</p>
  </header>
  <section id="songs" class="songs"></section>
</main>

<main id="player" hidden>
  <canvas id="stage"></canvas>

  <div class="hud">
    <button id="back" class="ghost" title="Back to songs">&larr;</button>
    <div class="hud-song"><b id="hud-title"></b><span id="hud-artist"></span></div>
    <div class="hud-score"><b id="score">0%</b><span id="score-detail">0 / 0 notes</span></div>
    <div class="hud-best">Best <b id="best">--</b></div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="card">
      <h2 id="ov-title">Ready</h2>
      <p id="ov-body"></p>
      <button id="ov-action" class="primary">Start</button>
    </div>
  </div>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
